<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF School Library</title>

    <!-- META AdSense -->
    <meta name="google-adsense-account" content="ca-pub-5583008418926471">

    <!-- SCRIPT AdSense global -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5583008418926471" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            margin: 0;
            padding: 15px;
        }

        h2 {
            margin-top: 25px;
            color: #222;
        }

        .pdf-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .pdf-btn {
            padding: 12px;
            background: #0057ff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            flex: 0 0 calc(50% - 10px);
            text-align: center;
        }

        @media (min-width: 600px) {
            .pdf-btn { flex: 0 0 calc(25% - 10px); }
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
        }

        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 20px;
            width: 90%;
            max-width: 600px;
            border-radius: 8px;
        }

        .closeBtn {
            float: right;
            font-size: 25px;
            cursor: pointer;
        }

        #downloadBtn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: green;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
        }
    </style>

</head>
<body>

<h1>Bibliothèque PDF</h1>

<!-- ================== BLOC PUB (haut) ================== -->
<div style="margin:20px 0;">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-5583008418926471"
         data-ad-slot="3783049488"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script> (adsbygoogle = window.adsbygoogle || []).push({}); </script>
</div>


<!-- ================== MATH (88 PDFs) ================== -->
<h2>Mathématiques (88 PDF)</h2>
<div class="pdf-container">
<script>
document.write(
    Array.from({length: 88}, (_, i) =>
        `<button class="pdf-btn" onclick="previewPDF('https://kiffedaniel.github.io/pdf-storage/pdf/math/math (${i+1}).pdf')">Math (${i+1})</button>`
    ).join("")
);
</script>
</div>

<!-- ================== BLOC PUB (bas) ================== -->
<div style="margin:20px 0;">
    <ins class="adsbygoogle"
         style="display:block; text-align:center;"
         data-ad-layout="in-article"
         data-ad-format="fluid"
         data-ad-client="ca-pub-5583008418926471"
         data-ad-slot="9322316622"></ins>
    <script> (adsbygoogle = window.adsbygoogle || []).push({}); </script>
</div>


<!-- ================ MODAL PDF PREVIEW ================= -->
<div id="pdfPreviewModal" class="modal">
    <div class="modal-content">
        <span class="closeBtn">&times;</span>
        <iframe id="pdfFrame" width="100%" height="500px"></iframe>
        <button id="downloadBtn">Télécharger</button>
    </div>
</div>


<script>
// Smartlink + téléchargement réel
function smartlinkBeforeDownload(realLink) {
    window.open("https://www.effectivegatecpm.com/x4zrx08iv?key=78f784bfb2f9e34830ed390fc0343ad8", "_blank");

    setTimeout(() => {
        window.location.href = realLink;
    }, 1200);
}

function previewPDF(url) {
    document.getElementById("pdfFrame").src = url;
    document.getElementById("downloadBtn").onclick = () => smartlinkBeforeDownload(url);
    document.getElementById("pdfPreviewModal").style.display = "block";
}

document.querySelector(".closeBtn").onclick = function() {
    document.getElementById("pdfPreviewModal").style.display = "none";
};
</script>

</body>
</html>
